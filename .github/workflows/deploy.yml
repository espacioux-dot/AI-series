# Publica la web en GitHub Pages cada vez que se sube algo a main.
# También se puede correr a mano desde la pestaña Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Valores públicos del proyecto de Supabase en la nube. Se cargan en
      # Settings → Secrets and variables → Actions → Variables.
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # El sitio vive en https://<usuario>.github.io/<repo>/
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Revisar que estén la URL y la clave pública de Supabase
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltan las variables SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY. Cargalas en Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la web y revisar que no tenga claves secretas
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
